name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 仓库规则（密钥、IP、真实 wxid）
        run: git ls-files -z | xargs -0 scripts/check-secrets.sh
      - name: gitleaks（全部历史）
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --no-banner --redact -v

  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 桥接单元测试、管理台构建、脚本语法、内核扩展测试
        run: scripts/test.sh
